[project]
name = "xc-lab"
version = "0.1.0"
description = "Fast experiments and weekly meeting material on cross-country soaring flights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xc-dynamics",
    "soaring",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "scipy>=1.11",
    # Vilpellet's tail fits; 2.0 bounds alpha to [0, 3] by default, so mu could not exceed 2.
    "powerlaw==1.5",
]

[tool.uv.sources]
xc-dynamics = { path = "../xc-dynamics", editable = true }
# The old monorepo frozen at tag legacy-final. Editable on purpose: soaring finds its
# YAML configs relative to its own checkout, which a wheel copy would lose.
soaring = { path = "../soaring-legacy", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["common", "methods", "analyses"]
# Idea and analysis folders are not packages and reuse file names like test_run.py.
addopts = "-ra --import-mode=importlib"
